plugins { id 'com.android.application' }

android {
    namespace 'com.goreecloud.launcher'
    compileSdk 36
    defaultConfig {
        applicationId 'com.goreecloud.launcher'
        minSdk 26
        targetSdk 36
        testInstrumentationRunner 'com.goreecloud.launcher.test.DockActionProbe'
        versionCode 1
        versionName '0.1.0-dev'
    }
    // One-off sideload testing without replacing an installed/retained Launcher package.
    // CI debug keys are ephemeral: this package is NOT a stable update channel.
    buildTypes {
        evaluation {
            initWith debug
            // Github-hosted debug keys are ephemeral. Isolate each CI-installed
            // evaluation package instead of presenting an invalid update to
            // another CI build or deleting the user's existing launcher data.
            def runId = System.getenv('GITHUB_RUN_ID')
            applicationIdSuffix ((runId != null && runId ==~ /[0-9]+/)
                    ? ".qa.run${runId}" : '.qa.local')
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
