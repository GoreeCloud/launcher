name: Native Android temporary app availability
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-availability.yml'
      - 'ci/emulator-app-availability.sh'
      - 'app/src/main/java/com/goreecloud/launcher/LauncherActivity.java'
      - 'app/src/main/java/com/goreecloud/launcher/CatalogRefreshPolicy.java'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-availability.yml'
      - 'ci/emulator-app-availability.sh'
      - 'app/src/main/java/com/goreecloud/launcher/LauncherActivity.java'

permissions:
  contents: read

jobs:
  app-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build native APKs
        run: gradle :app:assembleDebug :qa-fixture:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify temporary app unavailability and shortcut recovery
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ci/emulator-app-availability.sh
      - name: Upload synthetic visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoreeCloud-Launcher-app-availability-evidence
          path: build/emulator-evidence/
          if-no-files-found: warn
