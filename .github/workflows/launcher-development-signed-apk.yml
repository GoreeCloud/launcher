name: Launcher signed Development APK

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact protected main commit SHA (40 lowercase hex)"
        required: true
        type: string
      version_code:
        description: "New monotonic Development versionCode (must exceed 2000018)"
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: launcher-signed-development
  cancel-in-progress: false

jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    name: Verify and package signed Launcher Development APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: launcher-development-signing
    env:
      REQUESTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      REQUESTED_VERSION_CODE: ${{ inputs.version_code }}
      EXPECTED_CERT_SHA256: ${{ vars.LAUNCHER_DEVELOPMENT_CERT_SHA256 }}
    steps:
      - name: Check out exact protected revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject moving-source or downgrade requests
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUESTED_VERSION_CODE" =~ ^[0-9]+$ ]]
          test "$REQUESTED_VERSION_CODE" -gt 2000018
          test "$REQUESTED_VERSION_CODE" -le 2100000000
          test "$(git rev-parse HEAD)" = "$REQUESTED_MAIN_SHA"
          test "$GITHUB_SHA" = "$REQUESTED_MAIN_SHA"
          test "$GITHUB_REF" = refs/heads/main
          test "$(git status --porcelain)" = ""
      - name: Require an independently provisioned certificate pin
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_CERT_SHA256="${EXPECTED_CERT_SHA256,,}"
          [[ "$EXPECTED_CERT_SHA256" =~ ^[a-f0-9]{64}$ ]] || {
            echo "Missing/invalid LAUNCHER_DEVELOPMENT_CERT_SHA256 environment variable."
            exit 1
          }
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Materialize protected signing keystore
        shell: bash
        env:
          ENCODED_KEYSTORE: ${{ secrets.LAUNCHER_DEVELOPMENT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${ENCODED_KEYSTORE:-}" || {
            echo "Protected Development keystore has not been provisioned."
            exit 1
          }
          umask 077
          keystore="$RUNNER_TEMP/launcher-development-signing.jks"
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 0600 "$keystore"
          echo "GOREECLOUD_DEV_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "GOREECLOUD_DEV_VERSION_CODE=$REQUESTED_VERSION_CODE" >> "$GITHUB_ENV"
      - name: Validate and build with protected Development signing
        env:
          GOREECLOUD_DEV_KEYSTORE_PASSWORD: ${{ secrets.LAUNCHER_DEVELOPMENT_STORE_PASSWORD }}
          GOREECLOUD_DEV_KEY_ALIAS: ${{ secrets.LAUNCHER_DEVELOPMENT_KEY_ALIAS }}
          GOREECLOUD_DEV_KEY_PASSWORD: ${{ secrets.LAUNCHER_DEVELOPMENT_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOREECLOUD_DEV_KEYSTORE_PASSWORD:-}"
          test -n "${GOREECLOUD_DEV_KEY_ALIAS:-}"
          test -n "${GOREECLOUD_DEV_KEY_PASSWORD:-}"
          python3 scripts/check_privacy.py
          python3 scripts/check_manifest.py
          python3 scripts/check_identity.py
          python3 scripts/check_glaze_ui.py
          python3 scripts/check_glaze_motion_evaluation.py
          python3 scripts/check_room_cutover.py
          gradle --no-daemon lintDebug testDebugUnitTest assembleDebug
      - name: Verify package identity, signer pin, provenance and checksum
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt | sort -V | tail -n1)"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$aapt"
          test -x "$apksigner"
          apk="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          badging="$("$aapt" dump badging "$apk" | head -n1)"
          package="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$badging")"
          version="$(sed -n "s/.* versionCode='\([^']*\)'.*/\1/p" <<<"$badging")"
          version_name="$(sed -n "s/.* versionName='\([^']*\)'.*/\1/p" <<<"$badging")"
          test "$package" = "com.goreecloud.launcher.dev"
          test "$version" = "$REQUESTED_VERSION_CODE"
          test "$version_name" = "0.1.0-dev"
          certificate="$("$apksigner" verify --verbose --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          [[ "$certificate" =~ ^[a-f0-9]{64}$ ]]
          test "$certificate" = "${EXPECTED_CERT_SHA256,,}" || {
            echo "Development signing certificate differs from the pinned, protected identity."
            exit 1
          }
          mkdir -p distribution
          cp "$apk" distribution/GoreeCloud-Launcher-0.1.0-dev-vc${version}.apk
          cat > distribution/BUILD-PROVENANCE.txt <<EOF
          repository=GoreeCloud/launcher
          source_sha=$GITHUB_SHA
          application_id=$package
          version_name=$version_name
          version_code=$version
          signing_role=pinned-persistent-development
          signing_cert_sha256=$certificate
          workflow_run_id=$GITHUB_RUN_ID
          prior_CI1317_update_compatibility=not_asserted
          real_device_acceptance=not_asserted
          stable_release_authority=none
          EOF
          (cd distribution && sha256sum ./*.apk > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Upload candidate for controlled GoreeCloud Drive staging
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-launcher-pinned-development-candidate
          if-no-files-found: error
          retention-days: 14
          path: distribution/*
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${GOREECLOUD_DEV_KEYSTORE_PATH:-}" ]; then
            rm -f -- "$GOREECLOUD_DEV_KEYSTORE_PATH"
          fi
