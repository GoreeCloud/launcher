name: Native Android backup acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-backup.yml'
      - 'ci/emulator-backup.sh'
      - 'ci/emulator-menu-retry.sh'
      - 'app/src/main/java/com/goreecloud/launcher/BackupCodec.java'
      - 'app/src/main/java/com/goreecloud/launcher/SettingsActivity.java'
      - 'app/src/main/java/com/goreecloud/launcher/DockOrder.java'

permissions:
  contents: read

jobs:
  backup-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install compile SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build both debug APKs
        run: gradle :app:assembleDebug :qa-fixture:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android emulator host libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0
      - name: Prepare emulator with retry for transient SDK archive failures
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install emulator; then
              "$ANDROID_HOME/emulator/emulator" -version
              exit 0
            fi
            echo "::warning::Android emulator SDK download failed (attempt $attempt/3)"
            sleep "$((attempt * 15))"
          done
          exit 1
      - name: Verify backup with API 35 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ci/emulator-backup.sh
      - name: Upload synthetic-only UI QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoreeCloud-Launcher-backup-acceptance-evidence
          path: build/emulator-evidence/
          if-no-files-found: warn
