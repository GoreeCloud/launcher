name: Native Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile and test
        run: gradle :app:assembleDebug :app:testDebugUnitTest :qa-fixture:assembleDebug --no-daemon
      - name: Upload evaluation APK
        uses: actions/upload-artifact@v4
        with:
          name: GoreeCloud-Launcher-debug-unverified
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
