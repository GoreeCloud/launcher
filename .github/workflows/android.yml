name: Native Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify immutable Launcher UI CI actions and checkout safety
        run: python3 ci/check-workflow-pins.py
      - name: Verify disposable Settings ANR recovery and ADB safety
        run: |
          python3 ci/test_pixel_launcher_anr.py
          bash -n ci/emulator-settings-font.sh
          bash -n ci/test-settings-emulator-guard.sh
          bash ci/test-settings-emulator-guard.sh
      - name: Verify Home-role bounded visibility and safe emulator target
        run: |
          bash -n ci/emulator-home-role.sh
          bash -n ci/emulator-home-role-visibility.sh
          bash -n ci/test-emulator-home-role-visibility.sh
          bash ci/test-emulator-home-role-visibility.sh
          bash -n ci/test-emulator-home-role-capture.sh
          bash ci/test-emulator-home-role-capture.sh
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: '9.6.0'
      - name: Validate emulator test harness
        run: |
          for script in ci/emulator-menu-retry.sh ci/emulator-dock.sh ci/emulator-backup.sh ci/emulator-keyboard.sh; do bash -n "$script"; done
          bash ci/test-emulator-menu-retry.sh
          for script in ci/emulator-hierarchy-retry.sh ci/emulator-app-availability.sh; do bash -n "$script"; done
          bash ci/test-emulator-hierarchy-retry.sh
          for script in ci/emulator-admission.sh ci/test-emulator-admission.sh ci/emulator-backup.sh ci/emulator-dock.sh ci/emulator-dock-accessibility.sh ci/emulator-icon-refresh.sh ci/emulator-keyboard.sh; do bash -n "$script"; done
          bash ci/test-emulator-admission.sh
          bash -n ci/emulator-screenshot-retry.sh
          bash -n ci/test-emulator-screenshot-retry.sh
          bash ci/test-emulator-screenshot-retry.sh
          bash -n ci/test-availability-emulator-guard.sh
          bash ci/test-availability-emulator-guard.sh
      - name: Validate opt-in physical-device smoke guard
        run: |
          bash -n ci/physical-device-smoke.sh
          bash ci/physical-device-smoke.sh --help >/dev/null
          if GOREELAUNCHER_DEVICE_SMOKE_ACK= bash ci/physical-device-smoke.sh /nonexistent.apk >/dev/null 2>&1; then
            echo 'Unsafe: device smoke allowed execution without explicit acknowledgement' >&2
            exit 1
          fi
      - name: Compile and test
        run: gradle :app:assembleDebug :app:testDebugUnitTest :qa-fixture:assembleDebug --no-daemon
      - name: Upload evaluation APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: GoreeCloud-Launcher-debug-unverified
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
