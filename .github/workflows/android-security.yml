name: Native Launcher security UI smoke
on:
  pull_request:
    paths:
      - 'app/src/main/**'
      - 'ci/emulator-security.sh'
      - '.github/workflows/android-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install compile SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug app
        run: gradle :app:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 security navigation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ci/emulator-security.sh
      - name: Upload nonsecret UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoreeCloud-security-navigation-no-secrets
          path: build/security-evidence/
          if-no-files-found: warn
