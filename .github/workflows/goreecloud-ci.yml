name: GoreeCloud Launcher foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-level verification
        run: |
          python3 scripts/verify_goreecloud.py
          python3 scripts/verify_launcher_layouts.py
          python3 scripts/verify_onboarding_brand.py
          python3 scripts/verify_onboarding_grid_about.py
          python3 scripts/verify_search_privacy.py
          python3 scripts/verify_universal_search.py
          python3 scripts/verify_launcher_screenshot_ux.py
          python3 scripts/verify_glaze_context_overview.py
          python3 scripts/verify_contact_search.py
          python3 scripts/verify_calculator_features.py
          python3 scripts/verify_merged_permissions.py --self-test
  android-debug-build:
    # Compilation is Development evidence only: debug signing is not an
    # update-compatible GoreeCloud Development distribution identity.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android 16-compatible Launcher standalone QA variant
        run: ./gradlew --no-daemon --console=plain assembleLawnWithQuickstepGithubQa
      - name: Verify actual merged Launcher QA permissions
        run: python3 scripts/verify_merged_permissions.py --qa
      - name: Package standalone QA APK
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          apk="$(find build/outputs/apk -type f -iname '*qa*.apk' -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.goreecloud.launcher.qa'"
          mkdir -p qa-apk
          cp "$apk" qa-apk/GoreeCloud-Launcher-Standalone-QA.apk
          git rev-parse HEAD > qa-apk/SOURCE_COMMIT.txt
          sha256sum qa-apk/GoreeCloud-Launcher-Standalone-QA.apk > qa-apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-standalone-qa-apk
          path: qa-apk/
          if-no-files-found: error
          retention-days: 7
