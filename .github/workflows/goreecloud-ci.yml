name: GoreeCloud Launcher foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-level verification
        run: python3 scripts/verify_goreecloud.py
  android-debug-build:
    # Compilation is Development evidence only: debug signing is not an
    # update-compatible GoreeCloud Development distribution identity.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android 16-compatible launcher Debug variant
        run: ./gradlew --no-daemon --console=plain assembleLawnWithQuickstepGithubDebug
