name: Native Android legacy compatibility
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-legacy.yml'
      - 'ci/emulator-legacy.sh'
      - 'app/src/main/java/com/goreecloud/launcher/SettingsActivity.java'
      - 'app/src/main/java/com/goreecloud/launcher/LauncherActivity.java'
      - 'app/src/main/AndroidManifest.xml'

permissions:
  contents: read

jobs:
  legacy-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 28]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android compile SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Launcher and QA fixture
        run: gradle :app:assembleDebug :qa-fixture:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android legacy app and default Home fallback
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ci/emulator-legacy.sh
      - name: Upload legacy emulator QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoreeCloud-Launcher-api${{ matrix.api-level }}-evidence
          path: build/emulator-evidence/
          if-no-files-found: warn
