name: Native Android 16 compatibility smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-api36.yml'
      - 'ci/emulator-smoke.sh'
      - 'app/src/main/**'
      - 'qa-fixture/src/main/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-api36.yml'
      - 'ci/emulator-smoke.sh'
      - 'app/src/main/**'
      - 'qa-fixture/src/main/**'

permissions:
  contents: read

jobs:
  android16-emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install compile SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        run: gradle :app:assembleDebug :qa-fixture:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch API 36 emulator and verify Home behavior
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ci/emulator-smoke.sh
      - name: Upload emulator QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoreeCloud-Launcher-API36-emulator-evidence
          path: build/emulator-evidence/
          if-no-files-found: warn
