name: Launcher QA APK
on:
  push:
    branches: [feat/lawnchair16-glaze-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon --console=plain assembleLawnWithQuickstepGithubDebug
      - run: python3 scripts/verify_merged_permissions.py
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-debug-qa
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
