name: Native Android isolated QA APK
on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/android-evaluation.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build evaluation-only APK
        run: gradle :app:assembleEvaluation --no-daemon
      - name: Verify package isolation and APK signature
        run: |
          APK="app/build/outputs/apk/evaluation/app-evaluation.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > /tmp/goreecloud-evaluation-badging.txt
          grep -F "package: name='com.goreecloud.launcher.qa'" /tmp/goreecloud-evaluation-badging.txt
          grep -F "application-label:'GoreeCloud Launcher QA'" /tmp/goreecloud-evaluation-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - name: Upload isolated evaluation APK
        uses: actions/upload-artifact@v4
        with:
          name: GoreeCloud-Launcher-QA-side-by-side-debug-unverified
          path: app/build/outputs/apk/evaluation/app-evaluation.apk
          if-no-files-found: error
