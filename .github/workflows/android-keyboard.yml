name: Native Android keyboard acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ci/prepare-emulator.sh'
      - '.github/workflows/android-keyboard.yml'
      - 'ci/emulator-keyboard.sh'
      - 'app/src/main/java/com/goreecloud/launcher/LauncherActivity.java'
  push:
    branches: [main]
    paths:
      - 'ci/prepare-emulator.sh'
      - '.github/workflows/android-keyboard.yml'
      - 'ci/emulator-keyboard.sh'
      - 'app/src/main/java/com/goreecloud/launcher/LauncherActivity.java'

permissions:
  contents: read

jobs:
  keyboard-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install compile SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile Launcher and test fixture
        run: gradle :app:assembleDebug :app:testDebugUnitTest :qa-fixture:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare Android emulator and host libraries
        run: bash ci/prepare-emulator.sh
      - name: Test shortcut keyboard controls on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ci/emulator-keyboard.sh
      - name: Upload keyboard QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoreeCloud-Launcher-keyboard-QA
          path: build/emulator-evidence/
          if-no-files-found: warn
