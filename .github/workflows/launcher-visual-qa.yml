name: Launcher Visual QA
on:
  push:
    branches: [feat/launcher-fullscreen-search-onboarding-20261014]
    paths:
      - .github/workflows/launcher-visual-qa.yml
      - scripts/capture_launcher_visual_qa.sh
      - scripts/check_launcher_visual_edges.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build QA variant
        run: ./gradlew --no-daemon --console=plain assembleLawnWithQuickstepGithubDebug
      - name: Screenshot analysis tools
        run: python3 -m pip install --break-system-packages Pillow
      - name: Allow accelerated emulator access
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo 'Warning: /dev/kvm unavailable; emulator may be slow'
          fi
      - name: Capture Android Home and edit mode
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          script: bash scripts/capture_launcher_visual_qa.sh
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-visual-qa
          path: visual-qa/
          if-no-files-found: warn
          retention-days: 14
