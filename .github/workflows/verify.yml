name: Source verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
  linux-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m compileall -q apps/linux
      - run: python -m unittest discover -s apps/linux/tests -v
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      # v4 no longer requests the removed Android SDK "tools" package.
      - uses: android-actions/setup-android@v4
        with: { packages: 'platform-tools' }
      - run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.4.1' }
      - run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
