name: Native Android responsive Home acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-responsive.yml'
      - 'ci/emulator-responsive.sh'
      - 'ci/emulator-admission.sh'
      - 'app/src/main/java/com/goreecloud/launcher/LauncherActivity.java'
      - 'app/src/main/java/com/goreecloud/launcher/ResponsiveHomePolicy.java'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-responsive.yml'
      - 'ci/emulator-responsive.sh'
      - 'ci/emulator-admission.sh'
      - 'app/src/main/java/com/goreecloud/launcher/LauncherActivity.java'
      - 'app/src/main/java/com/goreecloud/launcher/ResponsiveHomePolicy.java'

permissions:
  contents: read

jobs:
  responsive-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Install compile SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: '9.6.0'
      - name: Build launcher and test fixture
        run: gradle :app:assembleDebug :app:testDebugUnitTest :qa-fixture:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify responsive Home on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ci/emulator-responsive.sh
      - name: Upload responsive screenshots and UI hierarchy
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: GoreeCloud-Launcher-responsive-QA
          path: build/emulator-evidence/
          if-no-files-found: warn
